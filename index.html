<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>コタエログ</title>
  <meta name="description" content="現代国語・英語・生物・化学・地理・歴史の一問一答を、カード・クイズで覚えて記録する学習アプリ。">
  <meta name="theme-color" content="#171d38">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="コタエログ">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=23">
</head>
<body>
  <!-- 背景（ガラス越しに透ける色の層） -->
  <div class="backdrop" aria-hidden="true"></div>

  <header class="topbar glass" id="topbar">
    <button class="icon-btn" id="menuBtn" aria-controls="drawer" aria-expanded="false" aria-label="メニューを開く">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 7h16M4 12h11M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg>
    </button>
    <span class="wordmark"><span class="brand-mark" aria-hidden="true">答</span>コタエログ</span>
    <h1 class="topbar-title" id="viewTitle">ホーム</h1>
    <span class="topbar-badge" id="topBadge"></span>
    <button class="subj-pill" id="subjPill" aria-controls="subjMenu" aria-label="教科を切り替える" aria-haspopup="menu" aria-expanded="false" hidden>
      <span class="subj-dot"></span><span id="subjName"></span>
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="m6.5 9.5 5.5 5.5 5.5-5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </header>

  <!-- 右上の教科プルダウン -->
  <div class="menu-scrim" id="menuScrim"></div>
  <div class="subj-menu glass" id="subjMenu" role="menu" aria-label="教科"></div>

  <div class="scroller" id="scroller"><main id="view" class="view"></main></div>

  <nav id="dock" class="dock glass" data-noswipe aria-label="主要画面">
    <span class="dock-lens" aria-hidden="true"><span class="dock-glass"></span></span>
  </nav>

  <!-- サイドバー -->
  <div class="scrim" id="scrim"></div>
  <nav class="drawer glass" id="drawer" aria-label="メニュー" aria-hidden="true" inert>
    <div class="drawer-head">
      <div class="drawer-logo">答</div>
      <div>
        <div class="drawer-title">コタエログ</div>
        <div class="drawer-sub" id="drawerSub"></div>
      </div>
    </div>
    <div class="drawer-subj" id="drawerSubjWrap" hidden>
      <button class="subj-select" id="drawerSubjBtn" aria-haspopup="true" aria-expanded="false">
        <span class="subj-ini sm" id="drawerSubjIni"></span>
        <span class="grow"><small>教科</small><b id="drawerSubjName"></b></span>
        <svg class="chev-d" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="m6.5 9.5 5.5 5.5 5.5-5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="subj-options"><div class="subj-options-in" id="drawerSubjects" inert></div></div>
    </div>
    <div class="drawer-section">メニュー</div>
    <ul class="drawer-nav" id="drawerNav"></ul>
    <p class="drawer-hint">左→右スワイプでいつでも開けます</p>
  </nav>

  <!-- 詳細シート -->
  <div class="sheet-wrap" id="sheetWrap">
    <div class="sheet glass" id="sheet" role="dialog" aria-modal="true" aria-label="語の詳細" tabindex="-1"></div>
  </div>

  <div class="toast glass" id="toast" role="status"></div>

  <script src="js/data.js?v=3"></script>
  <script src="js/app.js?v=24"></script>
</body>
</html>
